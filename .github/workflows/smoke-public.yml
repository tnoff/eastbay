# Public smoke probe: runs smoke/site_smoke.py against https://eastbaymassageandlymph.com from a
# GitHub runner, every 15 minutes, and checks the TLS certificate.
#
# Why this exists. The in-cluster CronJob (docker-apps apps/eastbaymassage/smoke-cronjob.yaml) runs the
# same script against the website Service, because a pod cannot reach the public url: ingress-nginx
# requires PROXY protocol and kube-proxy sends a pod's traffic for the load balancer straight to an
# ingress pod, skipping the header. So DNS, the TLS certificate, the load balancer and the ingress
# rule are NOT covered by it. This workflow is the one thing that walks that whole path, the way a
# visitor does, including the contact form POST through the ingress.
#
# THE CONTACT FORM. The script submits it as SMOKE_TEST_EMAIL, an address the server accepts and never
# emails (app.py SMOKE_TEST_EMAIL), and only after the server announces that address in the
# X-Smoke-Test-Email header. If the setting is not deployed the form checks fail and nothing is posted,
# so this cannot put a test message in the owner's inbox.
#
# Same script in both places, so the two probes cannot drift apart: an in-cluster pass with a public
# failure means the problem is in front of the site, and the reverse means it is behind it.
#
# Secret: DISCORD_SMOKE_WEBHOOK_URL, the #smoke-tests webhook (terraform infra/repos.tf module.eastbay).
# A failure posts to #smoke-tests via the notify job. The fleet notifier (notify-failure.yml) also posts
# to #ci-alerts for the same run. That is deliberate: a broken notify job here would otherwise fail
# silently.
name: Smoke (public)

on:
  schedule:
    # Off the quarter hour: GitHub delays and sometimes drops runs on the hour and half hour. The other
    # public probes sit on 11,26,41,56 (hathor) and 14,29,44,59 (personal-website).
    - cron: '9,24,39,54 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# A slow run must not stack on the next one.
concurrency:
  group: smoke-public
  cancel-in-progress: false

jobs:
  probe:
    name: Probe eastbaymassageandlymph.com
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: site-smoke
        env:
          SMOKE_BASE_URL: https://eastbaymassageandlymph.com
          SMOKE_TEST_EMAIL: smoke-test@eastbaymassageandlymph.com
        run: python3 smoke/site_smoke.py

      # Certificates renew themselves (cert-manager); this catches the day they stop. 14 days is a week
      # of failed renewals, since cert-manager starts at 30 days left.
      - name: Certificate has at least 14 days left
        run: |
          set -euo pipefail
          echo | openssl s_client -connect eastbaymassageandlymph.com:443 -servername eastbaymassageandlymph.com 2>/dev/null \
            | openssl x509 -noout -enddate -checkend $((14 * 86400))

  notify:
    name: Notify #smoke-tests
    needs: probe
    if: failure()
    permissions: {}
    uses: tnoff/github-workflows/.github/workflows/discord-notify.yml@adea087c43d56fd13d5b1abf2d5f2ba3e695784d  # discord-notify-v1.0.0
    with:
      message: >-
        The public eastbay probe failed. It runs from outside the cluster, so this covers DNS, TLS,
        the load balancer and the ingress as well as the site. If the in-cluster CronJob
        (smoke-eastbay in the eastbay namespace) is passing, look in front of the site; the Actions
        log has the FAIL lines.
    secrets:
      discord_webhook_url: ${{ secrets.DISCORD_SMOKE_WEBHOOK_URL }}
