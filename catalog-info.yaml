# Backstage catalog descriptor. Discovered automatically -- the portal's GitHub
# provider reads catalog-info.yaml from the default branch of every repo the
# tnoff-backstage App can see, so this file is the whole of onboarding. Nothing
# needs registering by hand.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: eastbay
  description: >-
    Flask app serving eastbaymassageandlymph.com. Mostly static HTML with a
    server-side contact form that emails inbound enquiries to the business
    owner. Runs in the `eastbay` namespace as OTEL service `eastbay-website`.
  #
  # No annotations, and that is deliberate in two different ways.
  #
  # github.com/project-slug is DERIVED, not written here. The portal registers
  # AnnotateScmSlugEntityProcessor, which reads the slug off the location this
  # file was fetched from. So it cannot go stale, and it picks the right
  # annotation name if this repo ever changes host -- the stale
  # `gitlab.com/project-slug` left in the project spec after the GitHub
  # migration is the exact failure that motivated deriving it.
  #
  # The rest are absent for checked reasons rather than oversight:
  #
  #   backstage.io/techdocs-ref
  #     No mkdocs.yml, no docs/. The annotation asserts documentation exists at
  #     a path, so writing it now advertises a Docs tab with nothing behind it.
  #     Arrives in phase 3 with the mkdocs.yml it points at.
  #
  #   backstage.io/kubernetes-label-selector
  #     `app=website` is NOT unique. docker-apps runs this Deployment and
  #     personal-website's under that same label, in different namespaces, and
  #     Backstage has no kubernetes-namespace annotation to disambiguate with --
  #     the entity-side options are exactly kubernetes-id and
  #     kubernetes-label-selector. A bare selector would cross-wire the two
  #     components' pods, quietly and plausibly. The fix is
  #     backstage.io/kubernetes-id plus a matching label on both Deployments,
  #     which belongs in the change that installs the Kubernetes plugin and
  #     rolls those pods.
  #
  #   grafana/dashboard-selector, grafana/alert-label-selector
  #     Nothing to select yet. `eastbay-website` appears in
  #     monitoring/grafana/dashboards.yaml only as a template-variable value,
  #     not as a dashboard tag, and no alert rule carries it as a label.
spec:
  type: website
  owner: group:default/admin
  lifecycle: production
  dependsOn:
    - resource:default/eastbay-cert
---
# The TLS certificate this site is served over.
#
# Declared here rather than in docker-apps, where apps/eastbay/certificate.yaml
# applies it. Same rule as discord-postgres and backstage-postgres: a resource sits
# with the thing it serves, and that is also what lets the dependsOn above live in
# the one file that can express it.
#
# The entity name is NOT the Kubernetes object name. Both websites call their
# Certificate `website-cert`, in different namespaces -- a third instance of the
# `app: website` collision, and entityRefs have no namespace to disambiguate with,
# so two `website-cert` Resources would make the catalog reject one. Named for the
# site instead; the k8s object name is recorded here rather than in the entity name.
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: eastbay-cert
  description: >-
    cert-manager Certificate for `eastbaymassageandlymph.com`, issued into the `eastbay` namespace as the
    `website-cert` Secret. One site, one certificate -- unlike the mirror fleet, where three
    Components share one.
spec:
  type: certificate
  owner: group:default/admin
